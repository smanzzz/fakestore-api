spring.application.name=CloudStore

spring.profiles.active=dev

spring.datasource.url=jdbc:postgresql://${DB_ENDPOINT:localhost:5432}/${DB_NAME:cloudstore}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${DEV_MODE:false}
spring.jpa.properties.hibernate.format_sql=${DEV_MODE:false}
spring.jpa.open-in-view=false
server.forward-headers-strategy=framework
