<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container mt-5">
    <div class="row">
        <div class="col-md-6 text-center">
            <img th:src="${product.image}" class="img-fluid rounded" alt="Produktbild" style="max-height: 500px;">
        </div>
        <div class="col-md-6 mt-4 mt-md-0">
            <h2 th:text="${product.title}"></h2>
            <p class="text-muted text-uppercase" th:text="${product.category}"></p>
            <h3 class="text-primary mb-4" th:text="${product.price} + ' kr'"></h3>

            <p class="lead" th:text="${product.description}"></p>

            <form th:action="@{/cart/add}" method="post" class="mt-4">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="productId" th:value="${product.id}">
                <button type="submit" class="btn btn-primary btn-lg px-5">Lägg i varukorg</button>
            </form>

            <a href="/products" class="btn btn-link mt-3 text-secondary">&larr; Tillbaka till produkter</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
