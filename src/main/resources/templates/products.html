<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container">
    <h1 class="mb-4">Våra produkter</h1>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="product : ${products}">
            <div class="card h-100 shadow-sm">
                <img th:src="${product.image}" class="card-img-top p-3" alt="Produktbild" style="height: 250px; object-fit: contain;">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${product.title}"></h5>
                    <p class="card-text text-muted" th:text="${product.category}"></p>
                    <h4 class="card-text mt-auto text-primary" th:text="${product.price} + ' kr'"></h4>
                </div>
                <div class="card-footer bg-white border-top-0 d-flex justify-content-between">
                    <a th:href="@{/products/{id}(id=${product.id})}" class="btn btn-outline-secondary">Detaljer</a>
                    <form th:action="@{/cart/add}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="productId" th:value="${product.id}">
                        <button type="submit" class="btn btn-primary">Köp</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
