<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container mt-4">
    <h1 class="mb-4">Din varukorg</h1>

    <div th:if="${cartItems.isEmpty()}" class="alert alert-info">
        Din varukorg är tom. <a href="/products" class="alert-link">Gå till butiken</a>.
    </div>

    <div th:unless="${cartItems.isEmpty()}" class="row">
        <div class="col-lg-8">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>Produkt</th>
                                <th>Pris</th>
                                <th>Antal</th>
                                <th>Totalt</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${cartItems}">
                                <td>
                                    <div class="d-flex align-items-center">
                                        <img th:src="${item.product.image}" style="width: 50px; height: 50px; object-fit: contain;" class="me-3" alt="Produktbild">
                                        <span th:text="${item.product.title}"></span>
                                    </div>
                                </td>
                                <td th:text="${item.product.price} + ' kr'"></td>
                                <td th:text="${item.quantity}"></td>
                                <td class="fw-bold" th:text="${item.total} + ' kr'"></td>
                                <td>
                                    <form th:action="@{/cart/remove}" method="post">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <input type="hidden" name="productId" th:value="${item.product.id}">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">&times;</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card shadow-sm bg-light">
                <div class="card-body">
                    <h4 class="card-title mb-4">Sammanfattning</h4>
                    <div class="d-flex justify-content-between mb-3">
                        <span>Summa varor:</span>
                        <span class="fw-bold" th:text="${total} + ' kr'"></span>
                    </div>
                    <hr>
                    <div sec:authorize="isAnonymous()" class="alert alert-warning">
                        Du måste logga in för att beställa.
                        <div class="mt-2 text-center">
                            <a href="/login?checkout=true" class="btn btn-warning w-100">Logga in</a>
                        </div>
                    </div>
                    <form sec:authorize="isAuthenticated()" th:action="@{/checkout}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn btn-success btn-lg w-100">Slutför beställning</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
