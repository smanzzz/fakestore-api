version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cloudstore_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloudstore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: .
    container_name: cloudstore_backend
    ports:
      - "8080:8080"
    environment:
      - DB_ENDPOINT=db:5432
      - DB_NAME=cloudstore
      - DB_USER=postgres
      - DB_PASS=postgres
      - DDL_AUTO=update
      - JWT_SECRET=local-development-secret-minst-32-tecken-lang
      - DB_MAX_POOL_SIZE=5
      - DB_MIN_IDLE=1
      - COOKIE_SECURE=false
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
